name: Agent Host (read-only)
version: "0.4.0"
slug: multica_ro
description: >-
  Agent Host (read-only): Claude Code Remote Control, an optional Cursor My
  Machines worker and the Multica daemon, with read-only Home Assistant
  config/share/media mounts and a writable /workspace.
url: https://github.com/smangings/home-assistant-addons/tree/main/multica_ro
arch:
  - aarch64
  - amd64
# Required for s6-overlay v3: Docker must not inject tini as PID 1.
init: false
startup: services
boot: auto
hassio_api: true
hassio_role: default
homeassistant_api: true
# Web terminal (sign-in for Remote Control). nginx admits only the ingress proxy.
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-outline
panel_title: Agent Host RO
panel_admin: true
map:
  - type: homeassistant_config
    read_only: true
    path: /config
  - type: share
    read_only: true
  - type: ssl
    read_only: true
  - type: media
    read_only: true
options:
  remote_control: true
  remote_control_name: ""
  remote_control_directory: "/config"
  remote_control_permission_mode: "default"
  cursor_worker: false
  cursor_worker_name: ""
  cursor_worker_dirs: ""
  multica_token: ""
  server_url: "https://api.multica.ai"
  app_url: "https://multica.ai"
  workspace_id: ""
  device_name: ""
  runtime_name: ""
  anthropic_api_key: ""
  claude_code_oauth_token: ""
  cursor_api_key: ""
  openrouter_api_key: ""
  openrouter_model: "anthropic/claude-sonnet-4"
  max_concurrent_tasks: 2
schema:
  remote_control: bool
  remote_control_name: str?
  remote_control_directory: str?
  remote_control_permission_mode: list(default|acceptEdits|plan|auto|bypassPermissions)
  cursor_worker: bool
  cursor_worker_name: str?
  cursor_worker_dirs: str?
  multica_token: password?
  server_url: url
  app_url: url
  workspace_id: str?
  device_name: str?
  runtime_name: str?
  anthropic_api_key: password?
  claude_code_oauth_token: password?
  cursor_api_key: password?
  openrouter_api_key: password?
  openrouter_model: str?
  max_concurrent_tasks: int(1,20)
