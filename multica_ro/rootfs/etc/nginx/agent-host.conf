# Ingress gate for the Agent Host web terminal.
# Only the Supervisor ingress proxy (172.30.32.2) may connect; any other
# container on the hassio network gets 403 instead of a root shell.
daemon off;
user root;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 64;
}

http {
  access_log off;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream ttyd {
    server unix:/run/ttyd.sock;
  }

  server {
    listen 8099 default_server;

    allow 172.30.32.2;
    deny all;

    location / {
      proxy_pass http://ttyd;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }
  }
}
