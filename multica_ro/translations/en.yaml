configuration:
  remote_control:
    name: Claude Remote Control
    description: Run Claude Code Remote Control so this add-on appears as "HA Agent Host (RO)" at claude.ai/code. Sign in once from the Agent Host RO sidebar panel.
  remote_control_name:
    name: Remote Control name
    description: Environment name at claude.ai/code. Blank = "HA Agent Host (RO)". "(RO)" is appended if the name does not already say RO/read-only.
  remote_control_directory:
    name: Remote Control directory
    description: Directory Remote Control sessions start in (default /config — read-only in this add-on).
  remote_control_permission_mode:
    name: Remote Control permission mode
    description: Permission mode for Remote Control sessions. "default" asks for approval in claude.ai/code before edits and commands.
  cursor_worker:
    name: Cursor My Machines worker
    description: Run `agent worker start` so this add-on appears under Cursor My Machines. Needs cursor_api_key to be a personal user API key.
  cursor_worker_name:
    name: Cursor worker name
    description: Machine name in Cursor (used by worker=<name> triggers). Blank = "ha-agent-host-ro"; "-ro" is appended if missing.
  cursor_worker_dirs:
    name: Cursor worker directories
    description: Colon-separated git checkouts to register. Blank = /config (if it has a git remote) plus each /workspace/* checkout with a remote.
  multica_token:
    name: Multica token
    description: Personal access token (mul_…) from Multica Settings → API Tokens. Leave blank to run without the Multica daemon.
  server_url:
    name: Server URL
    description: Multica API base URL
  app_url:
    name: App URL
    description: Multica web app URL
  workspace_id:
    name: Workspace ID
    description: Optional workspace to select after login
  device_name:
    name: Device name
    description: Multica computer name. Blank = "HA Agent Host (RO)"; "(RO)" is appended if missing.
  runtime_name:
    name: Runtime name
    description: Leave blank so Claude, Cursor, and Pi each register as separate runtimes.
  anthropic_api_key:
    name: Anthropic API key
    description: Claude Code Console/API key (API billing — does not use Pro/Max subscription usage)
  claude_code_oauth_token:
    name: Claude Code OAuth token
    description: Pro/Max subscription token from `claude setup-token` (preferred for subscription usage)
  cursor_api_key:
    name: Cursor API key
    description: Cursor personal user API key — headless Cursor Agent auth and the My Machines worker
  openrouter_api_key:
    name: OpenRouter API key
    description: API key so the Pi agent can call OpenRouter models
  openrouter_model:
    name: OpenRouter model
    description: Default Pi model id on OpenRouter (author/model)
  max_concurrent_tasks:
    name: Max concurrent tasks
    description: Maximum agent tasks this daemon runs in parallel
